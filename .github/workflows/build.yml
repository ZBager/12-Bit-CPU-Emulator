name: build

on:
  push:
    branches: [ main ]
    # Pushing a v-prefixed tag is what publishes a Release.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Packaging only runs once the CPU is known good on every platform.
  appimage:
    name: package linux (AppImage)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build AppImage
        run: ./packaging/linux/build-appimage.sh "${{ github.workspace }}/artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: CpuEmulator-linux-x86_64-AppImage
          path: artifacts/CpuEmulator-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: package macos (${{ matrix.rid }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build .app bundle
        run: ./packaging/macos/build-app.sh ${{ matrix.rid }} "${{ github.workspace }}/artifacts"

      # upload-artifact zips its input and drops the executable bit, which would
      # leave the .app unlaunchable. Tar it first so permissions survive.
      - name: Archive bundle
        run: tar -czf "CpuEmulator-${{ matrix.rid }}.tar.gz" -C artifacts "CpuEmulator-${{ matrix.rid }}"

      - uses: actions/upload-artifact@v7
        with:
          name: CpuEmulator-${{ matrix.rid }}
          path: CpuEmulator-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  windows:
    name: package windows (win-x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: >
          dotnet publish src/CpuEmulator.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CpuEmulator-win-x64

      # upload-artifact zips a directory on the way down, but a release asset
      # must already be a single file, so zip it explicitly.
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/CpuEmulator-win-x64 -DestinationPath CpuEmulator-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: CpuEmulator-win-x64
          path: CpuEmulator-win-x64.zip
          if-no-files-found: error

  # Only ever runs for a pushed v* tag. Everything above has already produced
  # and validated the packages; this job just names them after the tag,
  # checksums them, and attaches them to a Release so they are downloadable
  # from the repo front page without a GitHub account.
  release:
    name: publish release
    needs: [appimage, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: Name assets after the tag and checksum them
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          mv "staging/CpuEmulator-x86_64.AppImage"  "dist/CpuEmulator-${version}-x86_64.AppImage"
          mv "staging/CpuEmulator-osx-arm64.tar.gz" "dist/CpuEmulator-${version}-osx-arm64.tar.gz"
          mv "staging/CpuEmulator-osx-x64.tar.gz"   "dist/CpuEmulator-${version}-osx-x64.tar.gz"
          mv "staging/CpuEmulator-win-x64.zip"      "dist/CpuEmulator-${version}-win-x64.zip"
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"

          # A hand-written description for this tag wins if one is committed;
          # otherwise fall back to the generic template below.
          if [ -f "docs/releases/${version}.md" ]; then
            echo "Using docs/releases/${version}.md"
            cp "docs/releases/${version}.md" notes.md
          else
            echo "No docs/releases/${version}.md -- using the generic template"
          cat > notes.md <<'NOTES'
          Cross-platform builds of the 12-bit CPU emulator, produced by CI from this tag.

          | Platform | Download |
          | --- | --- |
          | Linux (x86_64) | `*-x86_64.AppImage` — `chmod +x` it, then run |
          | macOS (Apple Silicon) | `*-osx-arm64.tar.gz` |
          | macOS (Intel) | `*-osx-x64.tar.gz` |
          | Windows (x64) | `*-win-x64.zip` |

          Each build is self-contained: the .NET runtime is bundled, so nothing needs installing.

          ### macOS: first run

          These builds are **unsigned**. macOS quarantines unsigned apps downloaded from the
          internet and reports them as *"damaged and can't be opened"*, which is misleading —
          the download is fine. Clear the quarantine flag once:

          ```
          xattr -dr com.apple.quarantine "CPU Emulator.app"
          ```

          ### Verifying a download

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```
          NOTES
          fi

          # A release title may contain spaces and punctuation a git tag cannot,
          # so an optional first-line "# Title" in the notes file becomes the
          # release title and is stripped from the body.
          title="${version}"
          if head -1 notes.md | grep -q '^# '; then
            title="$(head -1 notes.md | sed 's/^# //')"
            tail -n +2 notes.md | sed '/./,$!d' > notes.body.md
            mv notes.body.md notes.md
          fi
          echo "Release title: ${title}"

          gh release create "${version}" dist/* \
            --title "${title}" \
            --notes-file notes.md \
            --verify-tag
