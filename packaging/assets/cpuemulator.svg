<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#071c45"/>
      <stop offset="1" stop-color="#010817"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7597"/>
      <stop offset="0.45" stop-color="#243b61"/>
      <stop offset="1" stop-color="#0e1e3a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123267"/>
      <stop offset="1" stop-color="#04122e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bfc5cd"/>
      <stop offset="0.7" stop-color="#f1f2f4"/>
      <stop offset="1" stop-color="#7e8792"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ffff"/>
      <stop offset="0.5" stop-color="#38eaff"/>
      <stop offset="1" stop-color="#00aaff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="196" height="196" rx="48" fill="#00aaff" opacity=".08" filter="url(#soft)"/>

  <!-- Pins -->
  <g fill="url(#metal)" stroke="#6d7783" stroke-width="1" filter="url(#shadow)">
    <rect x="76" y="20" width="16" height="31" rx="4"/>
    <rect x="120" y="20" width="16" height="31" rx="4"/>
    <rect x="164" y="20" width="16" height="31" rx="4"/>
    <rect x="76" y="205" width="16" height="31" rx="4"/>
    <rect x="120" y="205" width="16" height="31" rx="4"/>
    <rect x="164" y="205" width="16" height="31" rx="4"/>
    <rect x="20" y="76" width="31" height="16" rx="4"/>
    <rect x="20" y="120" width="31" height="16" rx="4"/>
    <rect x="20" y="164" width="31" height="16" rx="4"/>
    <rect x="205" y="76" width="31" height="16" rx="4"/>
    <rect x="205" y="120" width="31" height="16" rx="4"/>
    <rect x="205" y="164" width="31" height="16" rx="4"/>
  </g>

  <!-- CPU package -->
  <rect x="43" y="43" width="170" height="170" rx="25" fill="#08152c" opacity=".9" filter="url(#shadow)"/>
  <rect x="45" y="41" width="166" height="174" rx="24" fill="url(#body)" stroke="#7891b4" stroke-width="1.5"/>
  <rect x="55" y="51" width="146" height="154" rx="19" fill="#0b1b37" stroke="#162d52" stroke-width="3"/>

  <!-- Glowing inner frame -->
  <rect x="62" y="58" width="132" height="140" rx="15" fill="none" stroke="#008dff" stroke-width="8" opacity=".55" filter="url(#glow)"/>
  <rect x="63" y="59" width="130" height="138" rx="14" fill="url(#face)" stroke="url(#cyan)" stroke-width="3"/>

  <!-- Text -->
  <g fill="url(#cyan)" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle"
     stroke="#b8ffff" stroke-opacity=".22" stroke-width=".7" paint-order="stroke">
    <text x="128" y="122" font-size="58" letter-spacing="-2">12</text>
    <text x="128" y="166" font-size="42" letter-spacing="1">BIT</text>
  </g>
  <g fill="none" stroke="#5ff6ff" opacity=".28">
    <rect x="68" y="64" width="120" height="128" rx="10"/>
  </g>
</svg>
